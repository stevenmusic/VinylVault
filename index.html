<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0A07">
<meta name="description" content="VinylVault — 黑膠唱片版本收藏管理">
<title>VinylVault</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230C0A07'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23C9A24B' stroke-width='1'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23C9A24B'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --ink:#0C0A07;
  --ink-2:#131009;
  --ink-3:#1B1710;
  --cream:#F4ECDA;
  --gold:#C9A24B;
  --gold-dim:#8A6E33;
  --line:rgba(201,162,75,.22);
  --muted:rgba(244,236,218,.58);
  --danger:#C1573F;
  --ok:#6F9A63;
  --radius:14px;
  --shadow:0 18px 44px rgba(0,0,0,.55);
  --serif:"Cormorant Garamond","Noto Serif TC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--cream);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(201,162,75,.13), transparent 62%),
    radial-gradient(700px 420px at 100% 4%, rgba(201,162,75,.07), transparent 60%);
}
a{color:var(--gold);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}

/* ---------- layout ---------- */
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 18px 96px}

header.top{
  position:sticky;top:0;z-index:30;
  background:rgba(12,10,7,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.top-inner{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand .disc{
  width:30px;height:30px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 50% 50%, var(--gold) 0 15%, var(--ink-3) 16% 100%);
  box-shadow:0 0 0 1px var(--line), inset 0 0 0 4px rgba(201,162,75,.16);
}
.brand h1{
  font-family:var(--serif);font-size:22px;letter-spacing:.16em;margin:0;font-weight:600;
  text-transform:uppercase;white-space:nowrap;
}
.brand h1 span{color:var(--gold)}
.top-spacer{flex:1}
.stat-pill{
  display:none;gap:14px;font-size:12px;letter-spacing:.08em;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap;
}
.stat-pill b{color:var(--gold);font-weight:600}
@media(min-width:760px){.stat-pill{display:flex}}
.icon-btn{
  width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);
  background:transparent;display:grid;place-items:center;font-size:16px;color:var(--cream);
  transition:.16s;
}
.icon-btn:hover{border-color:var(--gold);color:var(--gold)}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:22px 0 6px}
.crumbs button{background:none;border:0;padding:0;color:var(--muted);letter-spacing:inherit}
.crumbs button:hover{color:var(--gold)}
.crumbs .sep{color:var(--gold-dim)}
.crumbs .cur{color:var(--cream)}

.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin:6px 0 22px}
.page-head .titles{flex:1;min-width:220px}
.eyebrow{font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
h2.title{font-family:var(--serif);font-size:clamp(30px,6vw,46px);line-height:1.06;margin:0;font-weight:600}
.sub{color:var(--muted);font-size:13.5px;margin-top:8px}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:0 0 22px;opacity:.55}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line);background:transparent;color:var(--cream);
  border-radius:999px;padding:9px 18px;font-size:13.5px;letter-spacing:.04em;transition:.16s;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#171208;font-weight:600}
.btn.primary:hover{background:#d8b25e;color:#171208}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--gold)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:6px 13px;font-size:12.5px}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.search{position:relative;flex:1;min-width:190px}
.search input{width:100%;padding:10px 14px 10px 36px}
.search::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:17px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:999px;padding:7px 15px;font-size:12.5px;letter-spacing:.05em;transition:.16s;
}
.chip:hover{color:var(--gold);border-color:var(--gold)}
.chip.on{background:rgba(201,162,75,.14);border-color:var(--gold);color:var(--gold)}

input,select,textarea{
  background:var(--ink-2);border:1px solid var(--line);color:var(--cream);
  border-radius:10px;padding:10px 13px;font:inherit;font-size:14px;width:100%;
  transition:.16s;appearance:none;
}
input:focus,select,textarea:focus{outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.12)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{min-height:76px;resize:vertical}
label.fld{display:block;margin-bottom:14px}
label.fld > span{display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

/* ---------- grids ---------- */
.grid{display:grid;gap:16px}
.grid.artists{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.grid.albums{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid.versions{grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}

.card{
  position:relative;background:linear-gradient(180deg,var(--ink-2),var(--ink));
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  transition:.2s;display:flex;flex-direction:column;text-align:left;width:100%;padding:0;
}
.card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--shadow)}
.card .body{padding:14px 15px 15px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-family:var(--serif);font-size:19px;margin:0;font-weight:600;line-height:1.2}
.card .meta{font-size:12.5px;color:var(--muted)}

.cover{position:relative;aspect-ratio:1/1;background:var(--ink-3);overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.cover.ph{display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%, rgba(201,162,75,.16) 0 18%, var(--ink-3) 19% 100%)}
.cover.ph::after{content:"";width:16%;aspect-ratio:1;border-radius:50%;background:var(--gold);opacity:.55}

.artist-card .cover{aspect-ratio:4/3}
.count-row{display:flex;gap:12px;font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin-top:2px}
.count-row b{color:var(--gold);font-weight:600}

/* ---------- version card ---------- */
.vcard .badges{position:absolute;top:9px;left:9px;display:flex;flex-wrap:wrap;gap:5px;max-width:calc(100% - 18px)}
.badge{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  padding:4px 8px;border-radius:4px;background:rgba(12,10,7,.82);
  border:1px solid var(--line);color:var(--gold);backdrop-filter:blur(4px);
}
.badge.limited{background:var(--gold);color:#171208;border-color:var(--gold)}
.badge.excl{border-color:var(--cream);color:var(--cream)}
.swatch{
  position:absolute;bottom:9px;right:9px;width:28px;height:28px;border-radius:50%;
  border:2px solid rgba(244,236,218,.75);box-shadow:0 3px 12px rgba(0,0,0,.6);
}
.vcard .rows{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);margin-top:2px}
.vcard .rows div{display:flex;justify-content:space-between;gap:10px}
.vcard .rows span:last-child{color:var(--cream);text-align:right}
.price{font-family:var(--serif);font-size:20px;color:var(--gold);font-weight:600}
.actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;align-items:center}
.toggle{
  border:1px solid var(--line);background:transparent;border-radius:999px;
  padding:6px 12px;font-size:12px;letter-spacing:.05em;color:var(--muted);transition:.16s;
}
.toggle:hover{border-color:var(--gold);color:var(--gold)}
.toggle.want.on{background:rgba(193,87,63,.18);border-color:var(--danger);color:#E0836D}
.toggle.owned.on{background:rgba(111,154,99,.18);border-color:var(--ok);color:#9BC48F}
.card-menu{margin-left:auto;display:flex;gap:4px}
.mini{background:none;border:0;color:var(--muted);font-size:13px;padding:5px 6px;border-radius:6px;transition:.16s}
.mini:hover{color:var(--gold);background:rgba(201,162,75,.1)}
.mini.del:hover{color:var(--danger);background:rgba(193,87,63,.1)}

/* ---------- states ---------- */
.empty{
  border:1px dashed var(--line);border-radius:var(--radius);padding:52px 24px;text-align:center;color:var(--muted);
}
.empty h3{font-family:var(--serif);font-size:24px;color:var(--cream);margin:0 0 8px;font-weight:600}
.empty p{margin:0 auto 18px;max-width:400px;font-size:14px}
.skel{border:1px solid var(--line);border-radius:var(--radius);height:230px;
  background:linear-gradient(100deg,var(--ink-2) 30%,rgba(201,162,75,.07) 50%,var(--ink-2) 70%);
  background-size:220% 100%;animation:sh 1.3s infinite}
@keyframes sh{from{background-position:150% 0}to{background-position:-50% 0}}
.err{border:1px solid rgba(193,87,63,.5);background:rgba(193,87,63,.09);border-radius:var(--radius);
  padding:20px;color:#E9A996}
.err b{color:#F4C7B8;display:block;margin-bottom:5px}
.err code{font-size:12px;word-break:break-all;opacity:.85}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(4,3,2,.78);backdrop-filter:blur(4px);
  z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.mask{align-items:center;padding:24px}}
.modal{
  background:var(--ink-2);border:1px solid var(--line);border-radius:18px 18px 0 0;
  width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow);
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));
}
@media(min-width:640px){.modal{border-radius:18px;padding:26px}}
.modal h3{font-family:var(--serif);font-size:25px;margin:0 0 4px;font-weight:600}
.modal .hint{color:var(--muted);font-size:13px;margin:0 0 20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.checks{display:flex;flex-wrap:wrap;gap:18px;margin:2px 0 16px}
.checks label{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);cursor:pointer}
.checks input{width:17px;height:17px;accent-color:var(--gold);flex:none;padding:0}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}

/* ---------- toast / fab ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));
  z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--ink-3);border:1px solid var(--gold);color:var(--cream);border-radius:10px;
  padding:11px 17px;font-size:13.5px;box-shadow:var(--shadow);animation:up .22s ease-out}
.toast.bad{border-color:var(--danger);color:#EBB4A4}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;
  width:54px;height:54px;border-radius:50%;background:var(--gold);color:#171208;border:0;
  font-size:26px;line-height:1;display:grid;place-items:center;box-shadow:var(--shadow)}
.fab:hover{background:#d8b25e}
.side{margin-bottom:16px}
.side-h{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
  border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:6px}
.trk{display:flex;gap:10px;align-items:baseline;padding:4px 0;font-size:13.5px}
.trk-n{color:var(--gold);font-size:11.5px;min-width:26px;flex:none;letter-spacing:.04em}
.trk-t{flex:1;color:var(--cream)}
.trk-d{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <button class="brand" id="brand" aria-label="回首頁">
      <span class="disc"></span>
      <h1>Vinyl<span>Vault</span></h1>
    </button>
    <div class="top-spacer"></div>
    <div class="stat-pill" id="stats" hidden></div>
    <button class="icon-btn" id="settingsBtn" title="設定" aria-label="設定">⚙</button>
  </div>
</header>

<main class="wrap" id="app"></main>
<button class="fab" id="fab" hidden title="新增">+</button>
<div id="toasts"></div>
<div id="modalRoot"></div>

<script src="config.js"></script>
<script>
(() => {
'use strict';

/* ========================================================================== */
/* 設定                                                                        */
/* ========================================================================== */
const CFG = window.VINYLVAULT_CONFIG || {};
const LS = { base: 'vv.apiBase', token: 'vv.writeToken' };

const qp = new URLSearchParams(location.search);
if (qp.get('api')) localStorage.setItem(LS.base, qp.get('api').replace(/\/+$/, ''));

const getBase  = () => (localStorage.getItem(LS.base) || CFG.apiBase || '').replace(/\/+$/, '');
const getToken = () => localStorage.getItem(LS.token) || CFG.writeToken || '';

/* ========================================================================== */
/* API                                                                         */
/* ========================================================================== */
async function api(path, { method = 'GET', body } = {}) {
  const base = getBase();
  if (!base) throw new Error('尚未設定 API 網址');
  const headers = {};
  if (body) headers['Content-Type'] = 'application/json';
  const token = getToken();
  if (token && method !== 'GET') headers['Authorization'] = 'Bearer ' + token;

  let res;
  try {
    res = await fetch(base + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  } catch (e) {
    throw new Error('連線失敗，請確認 API 網址與 Worker 的 CORS 設定（' + e.message + '）');
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { /* 非 JSON */ }
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status + ' ' + text.slice(0, 160)));
  return data;
}

const Remote = {
  stats:          ()             => api('/stats'),
  artists:        (q)            => api('/artists' + (q ? '?q=' + encodeURIComponent(q) : '')),
  artist:         (id)           => api('/artists/' + id),
  createArtist:   (b)            => api('/artists', { method: 'POST', body: b }),
  updateArtist:   (id, b)        => api('/artists/' + id, { method: 'PATCH', body: b }),
  deleteArtist:   (id)           => api('/artists/' + id, { method: 'DELETE' }),
  albums:         (artistId)     => api('/albums?artist_id=' + artistId),
  album:          (id)           => api('/albums/' + id),
  createAlbum:    (b)            => api('/albums', { method: 'POST', body: b }),
  updateAlbum:    (id, b)        => api('/albums/' + id, { method: 'PATCH', body: b }),
  deleteAlbum:    (id)           => api('/albums/' + id, { method: 'DELETE' }),
  versions:       (qs)           => api('/versions' + (qs ? '?' + qs : '')),
  createVersion:  (b)            => api('/versions', { method: 'POST', body: b }),
  updateVersion:  (id, b)        => api('/versions/' + id, { method: 'PATCH', body: b }),
  deleteVersion:  (id)           => api('/versions/' + id, { method: 'DELETE' }),
  tracks:         (id)           => api('/versions/' + id + '/tracks'),
  setTracks:      (id, tracks)   => api('/versions/' + id + '/tracks', { method: 'PUT', body: { tracks } }),
};

/* ========================================================================== */
/* 本機模式：沒有設定 API 網址時，資料存在這台裝置的瀏覽器裡                     */
/* 介面跟 Remote 完全一樣，所以上層畫面不用知道自己在哪個模式                    */
/* ========================================================================== */
const DB_KEY = 'vv.db';

const blank = () => ({ artists: [], albums: [], versions: [], tracks: [], seq: 0 });

function load() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return blank();
    const d = JSON.parse(raw);
    return {
      artists: d.artists || [], albums: d.albums || [],
      versions: d.versions || [], tracks: d.tracks || [], seq: d.seq || 0,
    };
  } catch { return blank(); }
}

function save(d) {
  try { localStorage.setItem(DB_KEY, JSON.stringify(d)); }
  catch (e) { throw new Error('無法儲存到這台裝置（可能是儲存空間已滿）：' + e.message); }
}

const nowStamp = () => new Date().toISOString().slice(0, 19).replace('T', ' ');
const clone = (o) => JSON.parse(JSON.stringify(o));
const bit = (v) => (v === true || v === 1 || v === '1' || v === 'true' ? 1 : 0);

function numOrNull(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

/** 只寫入白名單欄位，並做型別轉換 */
function apply(target, body, fields) {
  for (const [key, cast] of Object.entries(fields)) {
    if (Object.prototype.hasOwnProperty.call(body, key)) target[key] = cast(body[key]);
  }
  target.updated_at = nowStamp();
  return target;
}

const strOrNull = (v) => {
  if (v === null || v === undefined) return null;
  const t = String(v).trim();
  return t === '' ? null : t;
};
const intOrNull = (v) => { const n = numOrNull(v); return n === null ? null : Math.trunc(n); };

const F_ARTIST  = { name: strOrNull, sort_name: strOrNull, country: strOrNull, image_url: strOrNull, notes: strOrNull, mb_id: strOrNull };
const F_ALBUM   = { artist_id: intOrNull, title: strOrNull, release_year: intOrNull, cover_url: strOrNull, label: strOrNull, notes: strOrNull, mb_id: strOrNull };
const F_VERSION = {
  album_id: intOrNull, name: strOrNull, cover_url: strOrNull, color: strOrNull, color_hex: strOrNull,
  is_limited: bit, is_exclusive: bit, exclusive_to: strOrNull, region: strOrNull,
  release_date: strOrNull, edition_size: intOrNull, price: numOrNull, currency: strOrNull,
  buy_url: strOrNull, want: bit, owned: bit, notes: strOrNull,
  format: strOrNull, catalog_no: strOrNull, mb_id: strOrNull, tracks_loaded: bit,
};

/** 從唱片編號取出面別：A1 -> A */
const sideOf = (n) => { const m = /^\s*([A-Za-z])/.exec(n || ''); return m ? m[1].toUpperCase() : null; };

const byId = (list, id) => list.find((x) => x.id === Number(id));

function decorateAlbum(d, al) {
  const vs = d.versions.filter((v) => v.album_id === al.id);
  return {
    ...al,
    artist_name: byId(d.artists, al.artist_id)?.name ?? '',
    version_count: vs.length,
    owned_count: vs.filter((v) => v.owned).length,
    want_count: vs.filter((v) => v.want).length,
  };
}

function decorateVersion(d, v) {
  const al = byId(d.albums, v.album_id);
  const ar = al ? byId(d.artists, al.artist_id) : null;
  return {
    ...v,
    album_title: al?.title ?? '',
    album_cover_url: al?.cover_url ?? null,
    artist_id: ar?.id ?? null,
    artist_name: ar?.name ?? '',
  };
}

const Local = {
  async stats() {
    const d = load();
    return {
      artists: d.artists.length, albums: d.albums.length, versions: d.versions.length,
      want: d.versions.filter((v) => v.want).length,
      owned: d.versions.filter((v) => v.owned).length,
    };
  },

  async artists(q) {
    const d = load();
    const kw = (q || '').toLowerCase();
    return d.artists
      .filter((a) => !kw || a.name.toLowerCase().includes(kw))
      .map((a) => {
        const als = d.albums.filter((al) => al.artist_id === a.id);
        const ids = als.map((al) => al.id);
        const vs = d.versions.filter((v) => ids.includes(v.album_id));
        return { ...a, album_count: als.length, version_count: vs.length, owned_count: vs.filter((v) => v.owned).length };
      })
      .sort((x, y) => (x.sort_name || x.name).localeCompare(y.sort_name || y.name, 'zh-Hant'));
  },

  async artist(id) {
    const a = byId(load().artists, id);
    if (!a) throw new Error('找不到這位歌手');
    return clone(a);
  },

  async createArtist(body) {
    const d = load();
    if (!strOrNull(body.name)) throw new Error('歌手名稱為必填');
    const row = apply({ id: ++d.seq, created_at: nowStamp() }, body, F_ARTIST);
    d.artists.push(row); save(d);
    return clone(row);
  },

  async updateArtist(id, body) {
    const d = load();
    const a = byId(d.artists, id);
    if (!a) throw new Error('找不到這位歌手');
    apply(a, body, F_ARTIST); save(d);
    return clone(a);
  },

  async deleteArtist(id) {
    const d = load();
    const n = Number(id);
    const albumIds = d.albums.filter((al) => al.artist_id === n).map((al) => al.id);
    const versionIds = d.versions.filter((v) => albumIds.includes(v.album_id)).map((v) => v.id);
    d.tracks = d.tracks.filter((t) => !versionIds.includes(t.version_id));
    d.versions = d.versions.filter((v) => !albumIds.includes(v.album_id));
    d.albums = d.albums.filter((al) => al.artist_id !== n);
    d.artists = d.artists.filter((a) => a.id !== n);
    save(d);
    return { deleted: true, id: n };
  },

  async albums(artistId) {
    const d = load();
    return d.albums
      .filter((al) => al.artist_id === Number(artistId))
      .map((al) => decorateAlbum(d, al))
      .sort((x, y) => (y.release_year || 0) - (x.release_year || 0) || x.title.localeCompare(y.title, 'zh-Hant'));
  },

  async album(id) {
    const d = load();
    const al = byId(d.albums, id);
    if (!al) throw new Error('找不到這張專輯');
    return decorateAlbum(d, al);
  },

  async createAlbum(body) {
    const d = load();
    if (intOrNull(body.artist_id) === null) throw new Error('缺少歌手');
    if (!strOrNull(body.title)) throw new Error('專輯名稱為必填');
    const row = apply({ id: ++d.seq, created_at: nowStamp() }, body, F_ALBUM);
    d.albums.push(row); save(d);
    return clone(row);
  },

  async updateAlbum(id, body) {
    const d = load();
    const al = byId(d.albums, id);
    if (!al) throw new Error('找不到這張專輯');
    apply(al, body, F_ALBUM); save(d);
    return clone(al);
  },

  async deleteAlbum(id) {
    const d = load();
    const n = Number(id);
    const versionIds = d.versions.filter((v) => v.album_id === n).map((v) => v.id);
    d.tracks = d.tracks.filter((t) => !versionIds.includes(t.version_id));
    d.versions = d.versions.filter((v) => v.album_id !== n);
    d.albums = d.albums.filter((al) => al.id !== n);
    save(d);
    return { deleted: true, id: n };
  },

  async versions(qs) {
    const d = load();
    const p = new URLSearchParams(qs || '');
    const albumId = p.get('album_id');
    const artistId = p.get('artist_id');
    const region = p.get('region');
    return d.versions
      .map((v) => decorateVersion(d, v))
      .filter((v) => {
        if (albumId !== null && v.album_id !== Number(albumId)) return false;
        if (artistId !== null && v.artist_id !== Number(artistId)) return false;
        if (region && v.region !== region) return false;
        for (const key of ['want', 'owned', 'is_limited', 'is_exclusive']) {
          if (p.get(key) !== null && v[key] !== bit(p.get(key))) return false;
        }
        return true;
      })
      .sort((x, y) => String(y.release_date || '').localeCompare(String(x.release_date || '')) ||
                      x.name.localeCompare(y.name, 'zh-Hant'));
  },

  async createVersion(body) {
    const d = load();
    if (intOrNull(body.album_id) === null) throw new Error('缺少專輯');
    if (!strOrNull(body.name)) throw new Error('版本名稱為必填');
    const row = apply({ id: ++d.seq, created_at: nowStamp(), currency: 'USD' }, body, F_VERSION);
    d.versions.push(row); save(d);
    return clone(row);
  },

  async updateVersion(id, body) {
    const d = load();
    const v = byId(d.versions, id);
    if (!v) throw new Error('找不到這個版本');
    apply(v, body, F_VERSION); save(d);
    return clone(v);
  },

  async deleteVersion(id) {
    const d = load();
    const n = Number(id);
    d.versions = d.versions.filter((v) => v.id !== n);
    d.tracks = d.tracks.filter((t) => t.version_id !== n);
    save(d);
    return { deleted: true, id: n };
  },

  async tracks(versionId) {
    const d = load();
    return d.tracks.filter((t) => t.version_id === Number(versionId))
                   .sort((a, b) => a.position - b.position);
  },

  async setTracks(versionId, list) {
    const d = load();
    const n = Number(versionId);
    const v = byId(d.versions, n);
    if (!v) throw new Error('找不到這個版本');
    d.tracks = d.tracks.filter((t) => t.version_id !== n);
    let pos = 0;
    for (const t of list) {
      const title = strOrNull(t.title);
      if (!title) continue;
      const number = strOrNull(t.number);
      d.tracks.push({
        id: ++d.seq, version_id: n, position: ++pos,
        side: strOrNull(t.side) || sideOf(number), number, title,
        length_ms: intOrNull(t.length_ms),
      });
    }
    v.tracks_loaded = 1;
    save(d);
    return d.tracks.filter((t) => t.version_id === n);
  },
};

/* ========================================================================== */
/* MusicBrainz —— 免費的公開音樂資料庫，不需要申請金鑰                          */
/* 直接從瀏覽器呼叫，所以本機模式也能用                                          */
/* ========================================================================== */
const MB = 'https://musicbrainz.org/ws/2';
const CAA = 'https://coverartarchive.org';

/** MusicBrainz 要求每秒最多一次請求，這裡排隊處理。 */
let mbChain = Promise.resolve();
let mbLast = 0;

/**
 * 依序嘗試幾條路徑，只要有一條通就好：
 *   1. 有設定 Worker 的話走自己的 Worker（最穩，不受瀏覽器跨網域限制）
 *   2. 直接連 MusicBrainz
 *   3. 公開的跨網域轉送服務（前兩條都被擋時的最後手段）
 */
function mbRoutes(query) {
  const direct = MB + query;
  const base = getBase();
  const list = [];
  if (base) list.push({ label: 'Worker', url: base + '/mb?path=' + encodeURIComponent(query) });
  list.push({ label: '直連', url: direct });
  list.push({ label: '轉送', url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent(direct) });
  return list;
}

function mbFetch(path) {
  const query = path + (path.includes('?') ? '&' : '?') + 'fmt=json';
  const run = async () => {
    const wait = Math.max(0, 1100 - (Date.now() - mbLast));
    if (wait) await new Promise((r) => setTimeout(r, wait));
    mbLast = Date.now();

    const problems = [];
    for (const route of mbRoutes(query)) {
      try {
        const res = await fetch(route.url, { headers: { Accept: 'application/json' } });
        if (res.status === 503) { problems.push(route.label + '：對方忙碌中'); continue; }
        if (!res.ok) { problems.push(route.label + '：HTTP ' + res.status); continue; }
        const data = await res.json();
        if (data && (data.error || data.message) && !data.artists && !data.releases && !data.media) {
          problems.push(route.label + '：' + (data.error || data.message));
          continue;
        }
        return data;
      } catch (e) {
        problems.push(route.label + '：' + (e.message || '連線失敗'));
      }
    }
    throw new Error('連不上音樂資料庫。' + problems.join('；'));
  };
  mbChain = mbChain.then(run, run);
  return mbChain;
}

const VINYL = /vinyl|lp\b|\bep\b.*vinyl|shellac/i;

/** 搜尋歌手 */
async function mbSearchArtists(name) {
  const d = await mbFetch('/artist?query=' + encodeURIComponent(name) + '&limit=8');
  return (d.artists || []).map((a) => ({
    mb_id: a.id,
    name: a.name,
    country: a.country || a.area?.name || null,
    type: a.type || null,
    hint: a.disambiguation || '',
    began: a['life-span']?.begin ? a['life-span'].begin.slice(0, 4) : null,
  }));
}

/** 抓一位歌手所有「黑膠」發行（分頁抓完） */
async function mbVinylReleases(artistMbid, onProgress) {
  const out = [];
  const seen = new Set();
  let offset = 0;
  for (let page = 0; page < 12; page++) {
    const d = await mbFetch('/release?artist=' + artistMbid +
      '&inc=media+release-groups+labels&limit=100&offset=' + offset);
    const list = d.releases || [];
    for (const r of list) {
      const media = r.media || [];
      const fmt = media.map((m) => m.format).filter(Boolean).join(' + ');
      if (!VINYL.test(fmt)) continue;
      const key = (r['release-group']?.title || r.title) + '|' + (r.date || '') + '|' + (r.country || '') + '|' + fmt;
      if (seen.has(key)) continue;
      seen.add(key);
      const label = r['label-info']?.[0];
      out.push({
        mb_id: r.id,
        title: r.title,
        group_title: r['release-group']?.title || r.title,
        group_id: r['release-group']?.id || null,
        primary_type: r['release-group']?.['primary-type'] || null,
        date: r.date || null,
        year: r.date ? Number(r.date.slice(0, 4)) : null,
        country: r.country || null,
        format: fmt || null,
        disambiguation: r.disambiguation || null,
        label: label?.label?.name || null,
        catalog_no: label?.['catalog-number'] || null,
        track_count: media.reduce((n, m) => n + (m['track-count'] || 0), 0),
      });
    }
    if (onProgress) onProgress(out.length, d['release-count'] || list.length);
    offset += 100;
    if (offset >= (d['release-count'] || 0)) break;
  }
  out.sort((a, b) => (a.year || 9999) - (b.year || 9999) ||
                     String(a.title).localeCompare(String(b.title)));
  return out;
}

/** 抓某一張發行的曲目（含 A1 / B2 這種面別編號） */
async function mbTracks(releaseMbid) {
  const d = await mbFetch('/release/' + releaseMbid + '?inc=recordings+media');
  const out = [];
  for (const m of d.media || []) {
    for (const t of m.tracks || []) {
      out.push({
        number: t.number || null,
        title: t.title || t.recording?.title || '',
        length_ms: t.length ?? t.recording?.length ?? null,
      });
    }
  }
  return out;
}

const mmss = (ms) => {
  if (!ms && ms !== 0) return '';
  const total = Math.round(ms / 1000);
  return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
};

const $ = (sel, root = document) => root.querySelector(sel);

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const attr = (s) => esc(s);

function safeUrl(u) {
  const s = String(u ?? '').trim();
  return /^https?:\/\//i.test(s) ? s : '';
}

function money(price, currency) {
  if (price === null || price === undefined || price === '') return '';
  const cur = currency || 'USD';
  try {
    return new Intl.NumberFormat('zh-Hant', { style: 'currency', currency: cur, maximumFractionDigits: 2 }).format(price);
  } catch { return cur + ' ' + price; }
}

function toast(msg, bad = false) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), bad ? 4200 : 2400);
}

function coverHtml(url, extra = '') {
  const u = safeUrl(url);
  return u
    ? '<div class="cover">' + extra + '<img loading="lazy" src="' + attr(u) + '" alt="" onerror="this.parentNode.classList.add(\'ph\');this.remove()"></div>'
    : '<div class="cover ph">' + extra + '</div>';
}

/* 表單 modal                                                                  */
/* ========================================================================== */
function openModal(html) {
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
  mask.addEventListener('mousedown', (e) => { if (e.target === mask) close(); });
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  function close() { document.removeEventListener('keydown', onKey); mask.remove(); }
  modalRoot.appendChild(mask);
  const first = mask.querySelector('input,select,textarea');
  if (first) setTimeout(() => first.focus(), 40);
  return { el: mask, close };
}

/**
 * 依欄位定義產生表單。
 * fields: [{ key, label, type, options?, placeholder?, required?, half? }]
 */
function formModal({ title, hint, fields, values = {}, submitLabel = '儲存', onSubmit }) {
  const render = (f) => {
    const v = values[f.key];
    const id = 'f_' + f.key;
    if (f.type === 'check') return '';
    let control;
    if (f.type === 'textarea') {
      control = '<textarea id="' + id + '" name="' + f.key + '" placeholder="' + attr(f.placeholder || '') + '">' + esc(v ?? '') + '</textarea>';
    } else if (f.type === 'select') {
      control = '<select id="' + id + '" name="' + f.key + '">' +
        f.options.map((o) => '<option value="' + attr(o.value) + '"' +
          (String(v ?? '') === String(o.value) ? ' selected' : '') + '>' + esc(o.label) + '</option>').join('') +
        '</select>';
    } else {
      control = '<input id="' + id + '" name="' + f.key + '" type="' + (f.type || 'text') + '"' +
        (f.type === 'number' ? ' step="any"' : '') +
        (f.required ? ' required' : '') +
        ' placeholder="' + attr(f.placeholder || '') + '" value="' + attr(v ?? '') + '">';
    }
    return '<label class="fld"><span>' + esc(f.label) + (f.required ? ' *' : '') + '</span>' + control + '</label>';
  };

  const checks = fields.filter((f) => f.type === 'check');
  const singles = fields.filter((f) => f.type !== 'check' && !f.half);
  const halves = fields.filter((f) => f.type !== 'check' && f.half);

  const html =
    '<h3>' + esc(title) + '</h3>' +
    (hint ? '<p class="hint">' + esc(hint) + '</p>' : '<p class="hint"></p>') +
    '<form id="vvForm" novalidate>' +
      singles.map(render).join('') +
      (halves.length ? '<div class="two">' + halves.map(render).join('') + '</div>' : '') +
      (checks.length ? '<div class="checks">' + checks.map((f) =>
        '<label><input type="checkbox" name="' + f.key + '"' + (values[f.key] ? ' checked' : '') + '>' + esc(f.label) + '</label>').join('') + '</div>' : '') +
      '<div class="modal-foot">' +
        '<button type="button" class="btn ghost" data-close>取消</button>' +
        '<button type="submit" class="btn primary">' + esc(submitLabel) + '</button>' +
      '</div>' +
    '</form>';

  const m = openModal(html);
  m.el.querySelector('[data-close]').onclick = m.close;
  const form = m.el.querySelector('#vvForm');

  form.onsubmit = async (e) => {
    e.preventDefault();
    const out = {};
    for (const f of fields) {
      const input = form.elements[f.key];
      if (!input) continue;
      if (f.type === 'check') { out[f.key] = input.checked ? 1 : 0; continue; }
      const raw = String(input.value ?? '').trim();
      if (f.required && !raw) { toast(f.label + ' 為必填', true); input.focus(); return; }
      out[f.key] = raw === '' ? null : (f.type === 'number' ? Number(raw) : raw);
    }
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = '處理中…';
    try {
      await onSubmit(out);
      m.close();
    } catch (err) {
      toast(err.message, true);
      btn.disabled = false; btn.textContent = submitLabel;
    }
  };
  return m;
}

function confirmModal(text, onYes) {
  const m = openModal(
    '<h3>確認刪除</h3><p class="hint">' + esc(text) + '</p>' +
    '<div class="modal-foot"><button class="btn ghost" data-no>取消</button>' +
    '<button class="btn danger" data-yes style="border-color:var(--danger);color:#E0836D">刪除</button></div>');
  m.el.querySelector('[data-no]').onclick = m.close;
  m.el.querySelector('[data-yes]').onclick = async () => {
    try { await onYes(); m.close(); } catch (e) { toast(e.message, true); }
  };
}

function openSettings() {

  const m = openModal(
    '<h3>設定</h3>' +
    '<p class="hint">' + (local
      ? '目前是<b style="color:var(--gold)">本機模式</b>：資料存在這台裝置的瀏覽器裡，不用任何帳號就能用，但不會跟其他裝置同步。'
      : '目前是<b style="color:var(--gold)">雲端模式</b>：資料存在你的資料庫，手機與電腦共用同一份。') + '</p>' +
    '<label class="fld"><span>API 網址（留空 = 本機模式）</span>' +
      '<input id="sBase" placeholder="https://…workers.dev" value="' + attr(getBase()) + '"></label>' +
    '<label class="fld"><span>寫入權杖（選填）</span>' +
      '<input id="sToken" type="password" placeholder="Worker 沒設定保護就留空" value="' + attr(getToken()) + '"></label>' +
    '<div id="sTest" class="hint"></div>' +
    (local
      ? '<div style="border-top:1px solid var(--line);margin:18px 0 14px;padding-top:16px">' +
        '<p class="hint" style="margin-bottom:10px">本機資料的備份 —— 換手機或清除瀏覽器資料前記得匯出。</p>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="btn sm" id="sExport">匯出備份</button>' +
          '<button class="btn sm" id="sImport">匯入備份</button>' +
          '<input type="file" id="sFile" accept="application/json,.json" hidden>' +
        '</div></div>'
      : '') +
    '<div class="modal-foot">' +
      '<button class="btn ghost" data-close>取消</button>' +
      '<button class="btn" id="sPing">測試連線</button>' +
      '<button class="btn primary" id="sSave">儲存</button>' +
    '</div>');

  const baseEl = m.el.querySelector('#sBase');
  const tokEl = m.el.querySelector('#sToken');
  const out = m.el.querySelector('#sTest');
  m.el.querySelector('[data-close]').onclick = m.close;

  m.el.querySelector('#sPing').onclick = async () => {
    const url = baseEl.value.trim().replace(/\/+$/, '');
    if (!url) { out.innerHTML = '<span style="color:var(--muted)">網址留空 = 本機模式，不需要連線。</span>'; return; }
    out.textContent = '測試中…';
    try {
      const j = await (await fetch(url + '/health')).json();
      out.innerHTML = j.ok
        ? '<span style="color:var(--ok)">✓ 連線成功，資料庫正常</span>'
        : '<span style="color:var(--danger)">✕ 有回應，但資料庫異常：' + esc(j.db || '未設定 Turso 環境變數') + '</span>';
    } catch (e) {
      out.innerHTML = '<span style="color:var(--danger)">✕ 連不上：' + esc(e.message) + '</span>';
    }
  };

  const exportBtn = m.el.querySelector('#sExport');
  if (exportBtn) {
    exportBtn.onclick = () => {
      const blob = new Blob([localStorage.getItem(DB_KEY) || JSON.stringify(blank())],
        { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'vinylvault-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('備份已下載');
    };
    const fileEl = m.el.querySelector('#sFile');
    m.el.querySelector('#sImport').onclick = () => fileEl.click();
    fileEl.onchange = async () => {
      const f = fileEl.files[0];
      if (!f) return;
      try {
        const data = JSON.parse(await f.text());
        if (!Array.isArray(data.artists)) throw new Error('這不是 VinylVault 的備份檔');
        save({ artists: data.artists, albums: data.albums || [], versions: data.versions || [],
               seq: data.seq || 0 });
        m.close(); toast('已匯入備份'); render();
      } catch (e) { toast(e.message, true); }
    };
  }

  m.el.querySelector('#sSave').onclick = () => {
    localStorage.setItem(LS.base, baseEl.value.trim().replace(/\/+$/, ''));
    localStorage.setItem(LS.token, tokEl.value.trim());
    m.close();
    toast('設定已儲存');
    render();
  };
}

  '<div class="grid ' + cls + '">' + Array.from({ length: n }, () => '<div class="skel"></div>').join('') + '</div>';

function crumbs(items) {
  return '<nav class="crumbs">' + items.map((it, i) =>
    (i ? '<span class="sep">/</span>' : '') +
    (it.hash ? '<button data-go="' + attr(it.hash) + '">' + esc(it.label) + '</button>'
             : '<span class="cur">' + esc(it.label) + '</span>')).join('') + '</nav>';
}

function pageHead(eyebrow, title, sub, actionsHtml = '') {
  return '<div class="page-head"><div class="titles">' +
    (eyebrow ? '<p class="eyebrow">' + esc(eyebrow) + '</p>' : '') +
    '<h2 class="title">' + esc(title) + '</h2>' +
    (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
    '</div>' + (actionsHtml ? '<div style="display:flex;gap:8px;flex-wrap:wrap">' + actionsHtml + '</div>' : '') +
    '</div><div class="rule"></div>';
}

const emptyState = (title, text, btn) =>
  '<div class="empty"><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p>' + (btn || '') + '</div>';

function errorState(err) {
  const needsSetup = /no such table|no such column/i.test(err.message);
  return '<div class="err">' +
    (needsSetup
      ? '<b>資料庫還沒有建立資料表</b><p style="margin:0 0 4px">按下面的按鈕，Worker 會自動幫你建好 artists / albums / versions 三張表。</p>'
      : '<b>載入失敗</b>') +
    '<code>' + esc(err.message) + '</code>' +
    '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
    (needsSetup ? '<button class="btn sm primary" data-setup>建立資料表</button>' +
                  '<button class="btn sm" data-setup-seed>建立並加入範例資料</button>' : '') +
    '<button class="btn sm" data-retry>重試</button>' +
    '<button class="btn sm" data-settings>連線設定</button></div></div>';
}

async function runSetup(seed) {
  try {
    const r = await api('/setup' + (seed ? '?seed=1' : ''), { method: 'POST' });
    toast(r.message || '資料表已建立');
    render();
  } catch (e) { toast(e.message, true); }
}

function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  const [name, id] = h.split('/');
  if (name === 'artist' && id) return { view: 'artist', id: Number(id) };
  if (name === 'album' && id)  return { view: 'album', id: Number(id) };
  if (name === 'collection')   return { view: 'collection' };
  return { view: 'home' };
}

let state = { filter: 'all', region: '', q: '' };

async function render() {
  const route = parseRoute();
  fab.hidden = true;
  refreshStats();
  try {
    if (route.view === 'artist')          await viewArtist(route.id);
    else if (route.view === 'album')      await viewAlbum(route.id);
    else if (route.view === 'collection') await viewCollection();
    else                                  await viewHome();
  } catch (err) {
    app.innerHTML = errorState(err);
  }
  bind();
}

async function refreshStats() {
  const el = $('#stats');
  try {
    const s = await API.stats();
    el.innerHTML =
      '<span>歌手 <b>' + s.artists + '</b></span>' +
      '<span>專輯 <b>' + s.albums + '</b></span>' +
      '<span>版本 <b>' + s.versions + '</b></span>' +
      '<span>❤ <b>' + s.want + '</b></span>' +
      '<span>✓ <b>' + s.owned + '</b></span>';
    el.hidden = false;
  } catch { el.hidden = true; }
}

function renderVersionPage(opts) {
  const { versions, crumbItems, eyebrow, title, sub, actions, onEmptyBtn, showAlbumName, fabAction } = opts;

  const regions = [...new Set(versions.map((v) => v.region).filter(Boolean))].sort();
  const filtered = versions.filter((v) => {
    if (state.filter === 'want' && !v.want) return false;
    if (state.filter === 'owned' && !v.owned) return false;
    if (state.filter === 'limited' && !v.is_limited) return false;
    if (state.region && v.region !== state.region) return false;
    return true;
  });

  const chip = (key, label) =>
    '<button class="chip' + (state.filter === key ? ' on' : '') + '" data-filter="' + key + '">' + label + '</button>';

  app.innerHTML = crumbs(crumbItems) +
    pageHead(eyebrow, title, sub, actions) +
    (versions.length ? '<div class="toolbar">' +
      '<div class="chips">' + chip('all', '全部') + chip('want', '❤ Want') +
        chip('owned', '✓ Owned') + chip('limited', 'Limited') + '</div>' +
      (regions.length > 1
        ? '<select id="regionSel" style="width:auto;min-width:140px"><option value="">所有地區</option>' +
          regions.map((r) => '<option value="' + attr(r) + '"' + (state.region === r ? ' selected' : '') + '>' + esc(r) + '</option>').join('') +
          '</select>'
        : '') +
      '<span style="color:var(--muted);font-size:12.5px;margin-left:auto">' + filtered.length + ' / ' + versions.length + '</span>' +
    '</div>' : '') +
    (filtered.length
      ? '<div class="grid versions">' + filtered.map((v) => versionCard(v, showAlbumName)).join('') + '</div>'
      : emptyState(
          versions.length ? '沒有符合篩選的版本' : '還沒有任何版本',
          versions.length ? '換個篩選條件看看。' : '加入第一個版本：顏色、限量、地區、售價都可以記錄。',
          versions.length ? '<button class="chip" data-filter="all">清除篩選</button>' : onEmptyBtn));

  if (fabAction) { fab.hidden = false; fab.onclick = fabAction; }
}

function versionCard(v, showAlbumName) {
  const badges =
    (v.is_limited ? '<span class="badge limited">Limited</span>' : '') +
    (v.is_exclusive ? '<span class="badge excl">' + esc(v.exclusive_to || 'Exclusive') + '</span>' : '') +
    (v.region ? '<span class="badge">' + esc(v.region) + '</span>' : '');
  const swatch = v.color_hex
    ? '<span class="swatch" style="background:' + attr(/^#[0-9a-f]{3,8}$/i.test(v.color_hex) ? v.color_hex : '#C9A24B') + '" title="' + attr(v.color || '') + '"></span>'
    : '';
  const cover = coverHtml(v.cover_url || v.album_cover_url, '<div class="badges">' + badges + '</div>' + swatch);
  const buy = safeUrl(v.buy_url);

  const rows = [
    showAlbumName && v.album_title ? ['專輯', v.artist_name + ' · ' + v.album_title] : null,
    v.color ? ['顏色', v.color] : null,
    v.format ? ['規格', v.format] : null,
    v.release_date ? ['發行', v.release_date] : null,
    v.catalog_no ? ['編號', v.catalog_no] : null,
    v.edition_size ? ['限量', Number(v.edition_size).toLocaleString() + ' 張'] : null,
  ].filter(Boolean);

  return '<div class="card vcard">' + cover +
    '<div class="body">' +
      '<h3>' + esc(v.name) + '</h3>' +
      (rows.length ? '<div class="rows">' + rows.map((r) =>
        '<div><span>' + esc(r[0]) + '</span><span>' + esc(r[1]) + '</span></div>').join('') + '</div>' : '') +
      (v.price != null ? '<div class="price" style="margin-top:8px">' + esc(money(v.price, v.currency)) + '</div>' : '') +
      (v.notes ? '<div class="meta" style="margin-top:6px">' + esc(v.notes) + '</div>' : '') +
      '<div class="actions">' +
        '<button class="toggle want' + (v.want ? ' on' : '') + '" data-toggle="want" data-id="' + v.id + '" data-val="' + (v.want ? 0 : 1) + '">❤ Want</button>' +
        '<button class="toggle owned' + (v.owned ? ' on' : '') + '" data-toggle="owned" data-id="' + v.id + '" data-val="' + (v.owned ? 0 : 1) + '">✓ Owned</button>' +
        '<div class="card-menu">' +
          ((v.tracks_loaded || v.mb_id) ? '<button class="mini" data-tracks=\'' + attr(JSON.stringify(v)) + '\' title="曲目">♪</button>' : '') +
          (buy ? '<a class="mini" href="' + attr(buy) + '" target="_blank" rel="noopener noreferrer" title="購買">🛒</a>' : '') +
          '<button class="mini" data-edit-version=\'' + attr(JSON.stringify(v)) + '\' title="編輯">✎</button>' +
          '<button class="mini del" data-del-version="' + v.id + '" data-name="' + attr(v.name) + '" title="刪除">🗑</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

/* ========================================================================== */
/* 從 MusicBrainz 匯入                                                         */
/* ========================================================================== */
function openImport(initialQuery) {
  const m = openModal(
    '<h3>從資料庫匯入</h3>' +
    '<p class="hint">輸入歌手名字，自動抓出他歷年來所有黑膠發行 —— 發行年份、地區、廠牌、曲目全都有。資料來自 MusicBrainz（免費的公開音樂資料庫）。</p>' +
    '<label class="fld"><span>歌手名稱</span>' +
      '<input id="mbQ" placeholder="例：Radiohead、周杰倫、Taylor Swift" autocomplete="off"></label>' +
    '<div id="mbBody"></div>' +
    '<div class="modal-foot"><button class="btn ghost" data-close>關閉</button>' +
    '<button class="btn primary" id="mbGo">搜尋</button></div>');

  const q = m.el.querySelector('#mbQ');
  const body = m.el.querySelector('#mbBody');
  const goBtn = m.el.querySelector('#mbGo');
  m.el.querySelector('[data-close]').onclick = m.close;

  const busy = (t) => { body.innerHTML = '<p class="hint" style="text-align:center;padding:18px 0">' + esc(t) + '</p>'; };
  const fail = (e) => { body.innerHTML = '<div class="err"><b>出錯了</b><code>' + esc(e.message) + '</code></div>'; };

  /* --- 步驟 1：搜尋歌手 --- */
  const search = async () => {
    const name = q.value.trim();
    if (!name) { q.focus(); return; }
    busy('搜尋中…');
    try {
      const list = await mbSearchArtists(name);
      if (!list.length) { body.innerHTML = '<p class="hint">找不到「' + esc(name) + '」，換個寫法試試（例如用英文原名）。</p>'; return; }
      body.innerHTML = '<p class="hint" style="margin:6px 0 10px">選一位：</p>' +
        '<div style="display:flex;flex-direction:column;gap:8px">' +
        list.map((a, i) =>
          '<button class="btn" data-pick="' + i + '" style="justify-content:flex-start;text-align:left;padding:11px 15px;border-radius:10px">' +
            '<span><b style="color:var(--cream)">' + esc(a.name) + '</b>' +
            '<span style="color:var(--muted);font-size:12.5px">' +
              [a.type, a.country, a.began, a.hint].filter(Boolean).map(esc).join(' · ') +
            '</span></span>' +
          '</button>').join('') + '</div>';
      body.querySelectorAll('[data-pick]').forEach((el) => {
        el.onclick = () => pickArtist(list[Number(el.dataset.pick)]);
      });
    } catch (e) { fail(e); }
  };

  /* --- 步驟 2：列出這位歌手的所有黑膠 --- */
  const pickArtist = async (artist) => {
    busy('正在抓 ' + artist.name + ' 的黑膠發行…');
    try {
      const releases = await mbVinylReleases(artist.mb_id,
        (n) => busy('正在抓 ' + artist.name + ' 的黑膠發行… 已找到 ' + n + ' 張'));
      if (!releases.length) {
        body.innerHTML = '<p class="hint">MusicBrainz 上查不到 ' + esc(artist.name) + ' 的黑膠發行。</p>';
        return;
      }
      const years = releases.map((r) => r.year).filter(Boolean);
      body.innerHTML =
        '<div style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px">' +
          '<b style="font-family:var(--serif);font-size:19px">' + esc(artist.name) + '</b>' +
          '<div class="hint" style="margin:4px 0 0">找到 <b style="color:var(--gold)">' + releases.length + '</b> 張黑膠' +
          (years.length ? '，年份 ' + Math.min(...years) + '–' + Math.max(...years) : '') + '</div>' +
        '</div>' +
        '<div style="max-height:38vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:14px">' +
          releases.map((r) =>
            '<div style="padding:7px 0;border-bottom:1px solid rgba(201,162,75,.1)">' +
              '<div style="font-size:13.5px">' + esc(r.title) + '</div>' +
              '<div style="color:var(--muted);font-size:11.5px">' +
                [r.year, r.country, r.format, r.label].filter(Boolean).map(esc).join(' · ') +
              '</div></div>').join('') +
        '</div>' +
        '<label class="checks" style="margin-bottom:14px"><label style="display:flex;align-items:center;gap:8px;cursor:pointer">' +
          '<input type="checkbox" id="mbTracks" checked>同時抓取曲目（每張約 1 秒，' + releases.length + ' 張約 ' + Math.ceil(releases.length * 1.2) + ' 秒）</label></label>' +
        '<button class="btn primary" id="mbImport" style="width:100%;justify-content:center">全部匯入 ' + releases.length + ' 張</button>' +
        '<div id="mbProg" class="hint" style="margin-top:10px"></div>';
      body.querySelector('#mbImport').onclick = () =>
        doImport(artist, releases, body.querySelector('#mbTracks').checked);
    } catch (e) { fail(e); }
  };

  /* --- 步驟 3：寫進收藏庫 --- */
  const doImport = async (artist, releases, withTracks) => {
    const btn = body.querySelector('#mbImport');
    const prog = body.querySelector('#mbProg');
    btn.disabled = true;
    const report = (t) => { prog.innerHTML = esc(t); };

    try {
      report('建立歌手…');
      const saved = await API.createArtist({
        name: artist.name, country: artist.country, mb_id: artist.mb_id,
        notes: '從 MusicBrainz 匯入',
      });

      // 以 release-group（＝專輯）分組，同一張專輯的不同壓片放在同一個專輯底下
      const groups = new Map();
      for (const r of releases) {
        const key = r.group_id || r.group_title;
        if (!groups.has(key)) groups.set(key, { title: r.group_title, year: r.year, mb_id: r.group_id, items: [] });
        const g = groups.get(key);
        if (r.year && (!g.year || r.year < g.year)) g.year = r.year;
        g.items.push(r);
      }

      let done = 0;
      const versionsToLoad = [];
      for (const g of groups.values()) {
        const album = await API.createAlbum({
          artist_id: saved.id, title: g.title, release_year: g.year, mb_id: g.mb_id,
          cover_url: g.items[0] ? caaCover(g.items[0].mb_id) : null,
        });
        for (const r of g.items) {
          const v = await API.createVersion({
            album_id: album.id,
            name: [r.title !== g.title ? r.title : null, r.disambiguation, r.country, r.format]
                    .filter(Boolean).join(' · ') || '黑膠',
            cover_url: caaCover(r.mb_id),
            region: r.country, release_date: r.date, format: r.format,
            catalog_no: r.catalog_no, mb_id: r.mb_id,
          });
          if (r.label && !album.label) await API.updateAlbum(album.id, { label: r.label });
          versionsToLoad.push({ versionId: v.id, mb_id: r.mb_id });
          done++;
          report('匯入中… ' + done + ' / ' + releases.length);
        }
      }

      if (withTracks) {
        let n = 0;
        for (const item of versionsToLoad) {
          n++;
          report('抓取曲目… ' + n + ' / ' + versionsToLoad.length + '（可以先關掉，之後點版本也會自動抓）');
          try {
            const list = await mbTracks(item.mb_id);
            if (list.length) await API.setTracks(item.versionId, list);
          } catch { /* 單張失敗不影響其他張 */ }
        }
      }

      m.close();
      toast('已匯入 ' + artist.name + '：' + groups.size + ' 張專輯、' + releases.length + ' 個版本');
      go('#/artist/' + saved.id);
      render();
    } catch (e) {
      btn.disabled = false;
      fail(e);
    }
  };

  goBtn.onclick = search;
  q.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); search(); } };
  if (initialQuery) { q.value = initialQuery; search(); }
}

/* ========================================================================== */
/* 曲目                                                                        */
/* ========================================================================== */
const trackCache = new Map();

async function ensureTracks(v) {
  if (trackCache.has(v.id)) return trackCache.get(v.id);
  let list = await API.tracks(v.id);
  if (!list.length && v.mb_id) {
    const fetched = await mbTracks(v.mb_id);
    if (fetched.length) list = await API.setTracks(v.id, fetched);
  }
  trackCache.set(v.id, list);
  return list;
}

function tracklistHtml(list) {
  if (!list.length) return '<p class="hint" style="margin:0">這個版本還沒有曲目資料。</p>';
  const sides = new Map();
  for (const t of list) {
    const key = t.side || '—';
    if (!sides.has(key)) sides.set(key, []);
    sides.get(key).push(t);
  }
  return [...sides.entries()].map(([side, items]) =>
    '<div class="side">' +
      '<div class="side-h">' + (side === '—' ? '曲目' : 'Side ' + esc(side)) + '</div>' +
      items.map((t) =>
        '<div class="trk">' +
          '<span class="trk-n">' + esc(t.number || '') + '</span>' +
          '<span class="trk-t">' + esc(t.title) + '</span>' +
          '<span class="trk-d">' + esc(mmss(t.length_ms)) + '</span>' +
        '</div>').join('') +
    '</div>').join('');
}

async function openTracks(v) {
  const m = openModal(
    '<h3>' + esc(v.name) + '</h3>' +
    '<p class="hint">' + esc([v.album_title, v.region, v.release_date, v.format].filter(Boolean).join(' · ')) + '</p>' +
    '<div id="tkBody"><p class="hint" style="text-align:center;padding:18px 0">載入曲目…</p></div>' +
    '<div class="modal-foot"><button class="btn ghost" data-close>關閉</button></div>');
  m.el.querySelector('[data-close]').onclick = m.close;
  try {
    m.el.querySelector('#tkBody').innerHTML = tracklistHtml(await ensureTracks(v));
  } catch (e) {
    m.el.querySelector('#tkBody').innerHTML = '<div class="err"><b>抓不到曲目</b><code>' + esc(e.message) + '</code></div>';
  }
}

/* ========================================================================== */
/* 新增 / 編輯                                                                 */
/* ========================================================================== */
const newArtist = () => formModal({
  title: '新增歌手', hint: '收藏庫的第一層', fields: artistFields, submitLabel: '新增',
  onSubmit: async (d) => { await API.createArtist(d); toast('已新增歌手'); render(); },
});

const editArtist = (a) => formModal({
  title: '編輯歌手', fields: artistFields, values: a, submitLabel: '儲存',
  onSubmit: async (d) => { await API.updateArtist(a.id, d); toast('已更新'); render(); },
});

const newAlbum = (artistId) => formModal({
  title: '新增專輯', fields: albumFields, submitLabel: '新增',
  onSubmit: async (d) => { await API.createAlbum({ ...d, artist_id: artistId }); toast('已新增專輯'); render(); },
});

const editAlbum = (al) => formModal({
  title: '編輯專輯', fields: albumFields, values: al, submitLabel: '儲存',
  onSubmit: async (d) => { await API.updateAlbum(al.id, d); toast('已更新'); render(); },
});

const newVersion = (albumId) => formModal({
  title: '新增版本', hint: '顏色、限量、地區、售價、購買連結', fields: versionFields,
  values: { currency: 'USD', color_hex: '#C9A24B' }, submitLabel: '新增',
  onSubmit: async (d) => { await API.createVersion({ ...d, album_id: albumId }); toast('已新增版本'); render(); },
});

const editVersion = (v) => formModal({
  title: '編輯版本', fields: versionFields, values: v, submitLabel: '儲存',
  onSubmit: async (d) => { await API.updateVersion(v.id, d); toast('已更新'); render(); },
});

/* ========================================================================== */
/* 事件綁定                                                                    */
/* ========================================================================== */
function bind() {
  document.querySelectorAll('[data-go]').forEach((el) => {
    el.onclick = (e) => { e.preventDefault(); go(el.dataset.go); };
  });
  document.querySelectorAll('[data-settings]').forEach((el) => { el.onclick = openSettings; });
  document.querySelectorAll('[data-retry]').forEach((el) => { el.onclick = render; });
  document.querySelectorAll('[data-import]').forEach((el) => { el.onclick = () => openImport(); });
  document.querySelectorAll('[data-import-q]').forEach((el) => {
    el.onclick = () => openImport(el.dataset.importQ);
  });
  document.querySelectorAll('[data-tracks]').forEach((el) => {
    el.onclick = () => openTracks(JSON.parse(el.dataset.tracks));
  });
  document.querySelectorAll('[data-setup]').forEach((el) => { el.onclick = () => runSetup(false); });
  document.querySelectorAll('[data-setup-seed]').forEach((el) => { el.onclick = () => runSetup(true); });

  document.querySelectorAll('[data-new-artist]').forEach((el) => { el.onclick = () => newArtist(); });
  document.querySelectorAll('[data-new-album]').forEach((el) => { el.onclick = () => newAlbum(Number(el.dataset.newAlbum)); });
  document.querySelectorAll('[data-new-version]').forEach((el) => { el.onclick = () => newVersion(Number(el.dataset.newVersion)); });

  document.querySelectorAll('[data-edit-artist]').forEach((el) => { el.onclick = () => editArtist(JSON.parse(el.dataset.editArtist)); });
  document.querySelectorAll('[data-edit-album]').forEach((el) => { el.onclick = () => editAlbum(JSON.parse(el.dataset.editAlbum)); });
  document.querySelectorAll('[data-edit-version]').forEach((el) => { el.onclick = () => editVersion(JSON.parse(el.dataset.editVersion)); });

  document.querySelectorAll('[data-del-artist]').forEach((el) => {
    el.onclick = () => confirmModal('刪除「' + el.dataset.name + '」會同時刪掉底下所有專輯與版本，確定嗎？',
      async () => { await API.deleteArtist(el.dataset.delArtist); toast('已刪除'); go('#/'); render(); });
  });
  document.querySelectorAll('[data-del-album]').forEach((el) => {
    el.onclick = () => confirmModal('刪除「' + el.dataset.name + '」會同時刪掉底下所有版本，確定嗎？',
      async () => { await API.deleteAlbum(el.dataset.delAlbum); toast('已刪除'); render(); });
  });
  document.querySelectorAll('[data-del-version]').forEach((el) => {
    el.onclick = () => confirmModal('確定刪除版本「' + el.dataset.name + '」？',
      async () => { await API.deleteVersion(el.dataset.delVersion); toast('已刪除'); render(); });
  });

  document.querySelectorAll('[data-toggle]').forEach((el) => {
    el.onclick = async () => {
      const field = el.dataset.toggle, val = Number(el.dataset.val), id = el.dataset.id;
      el.disabled = true;
      el.classList.toggle('on', val === 1);          // 樂觀更新
      el.dataset.val = val === 1 ? 0 : 1;
      try {
        await API.updateVersion(id, { [field]: val });
        toast(field === 'want' ? (val ? '已加入想要' : '已移除想要') : (val ? '已標記擁有' : '已取消擁有'));
        refreshStats();
      } catch (err) {
        el.classList.toggle('on', val !== 1);        // 回滾
        el.dataset.val = val;
        toast(err.message, true);
      } finally { el.disabled = false; }
    };
  });

  document.querySelectorAll('[data-filter]').forEach((el) => {
    el.onclick = () => { state.filter = el.dataset.filter; if (state.filter === 'all') state.region = ''; render(); };
  });

  const regionSel = $('#regionSel');
  if (regionSel) regionSel.onchange = () => { state.region = regionSel.value; render(); };

  const q = $('#q');
  if (q) {
    let t;
    q.oninput = () => { clearTimeout(t); t = setTimeout(() => { state.q = q.value.trim(); render(); }, 320); };
    if (state.q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
}

/* ========================================================================== */
window.addEventListener('hashchange', () => { state.filter = 'all'; state.region = ''; render(); });
render();
})();
</script>
